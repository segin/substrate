# /etc/inetd.conf — inetutils inetd service map.
#
# Format (whitespace-separated):
#   <service>  <socket>  <proto>  <wait>  <user>  <server>  <args>
#
# - service: name in /etc/services (telnet -> 23)
# - socket:  stream | dgram | raw | rdm | seqpacket
# - proto:   tcp | udp | unix (or tcp4 / tcp6 to pin family)
# - wait:    nowait (accept-per-conn, classic) | wait (server handles loop)
# - user:    drop privs to this account before exec
# - server:  absolute path to the program
# - args:    argv (including argv[0])

# inetutils telnetd is currently broken on substrate (closes every
# connection during session setup).  Substrate's own /sbin/telnetd
# runs standalone via /etc/rc.d/35-telnetd instead — keep this line
# commented out until the inetutils-side issue is diagnosed so that
# starting inetd does not race with the standalone daemon for port 23.
#telnet	stream	tcp	nowait	root	/usr/libexec/telnetd	telnetd
