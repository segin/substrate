# /etc/syslog.conf — selector-to-target rules for /sbin/syslogd.
#
# Format (one rule per line):
#   <facility>.<priority>[;...]    <TAB>    <target-path>
#
# Wildcards: *.* matches everything; .none suppresses a facility from
# a rule.  Priority means "this level or higher" — auth.warn catches
# warn / err / crit / alert / emerg messages on the auth facility.
#
# Facilities:  kern user mail daemon auth syslog lpr news uucp cron
#              authpriv ftp local0..local7
# Priorities:  emerg alert crit err warning notice info debug

# Per-facility files.
auth,authpriv.*                 /var/log/auth.log
mail.*                          /var/log/mail.log
cron.*                          /var/log/cron.log
daemon.*                        /var/log/daemon.log
kern.*                          /var/log/kern.log
user.*                          /var/log/user.log

# Catch-all (skips auth so credentials aren't double-logged in the
# clear).  authpriv.none excludes the more sensitive AUTHPRIV channel.
*.*;auth.none;authpriv.none     /var/log/messages

# Emergency messages broadcast to console.
*.emerg                         /dev/console
