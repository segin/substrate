# /etc/network.conf — substrate per-interface network configuration.
#
# Each non-comment line describes one interface:
#
#   <iface>  <mode>  [args ...]
#
# where <mode> is one of:
#
#   static <addr/prefix> [gateway <ip>]
#       Assign a fixed IPv4 address and optional default route.
#
#   dhcp
#       Run /sbin/dhclient on this interface to lease an address.
#
#   inet6 static <addr/prefix> [gateway <ip6>]
#       Assign a fixed IPv6 address and optional default v6 route.
#
# Multiple lines per interface are allowed (mix static IPv4 + static IPv6,
# or DHCP + static IPv6).  Order doesn't matter.
#
# Examples:
#   eth0  dhcp
#   eth0  inet6 static fec0::3/64 gateway fec0::2
#   eth1  static 192.168.1.10/24 gateway 192.168.1.1

eth0  dhcp
eth0  inet6 static fec0::3/64 gateway fec0::2
