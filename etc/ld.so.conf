# /etc/ld.so.conf — system default shared-library search directories.
#
# /sbin/ld.so always searches the built-in trusted directories /lib,
# /usr/lib and /usr/local/lib.  The directories listed here (and in the
# files pulled in by the include below) are searched in addition, after
# those — the system-wide equivalent of a baked-in LD_LIBRARY_PATH.
#
# Format: one absolute directory per line; blank lines and lines beginning
# with '#' are ignored.  `include <glob>` pulls in drop-in config files;
# the final path component may use '*'/'?' wildcards.

include /etc/ld.so.conf.d/*.conf
