# /etc/ld.so.conf — system default shared-library search directories.
#
# /sbin/ld.so always searches the built-in trusted directories /lib,
# /usr/lib and /usr/local/lib.  The directories listed here are searched
# in addition, after those — the system-wide equivalent of a baked-in
# LD_LIBRARY_PATH.
#
# Format: one absolute directory per line.  Blank lines and lines that
# begin with '#' are ignored.  (`include` / glob directives are not
# supported.)

# Trinity Desktop Environment (installs under /opt/trinity to coexist
# with KDE); its shared libraries and tdeinit_* wrapper libraries live
# here and are referenced by bare soname with no RPATH.
/opt/trinity/lib
