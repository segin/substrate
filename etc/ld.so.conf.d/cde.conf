# Common Desktop Environment (CDE) — installs under /usr/dt.  libDtSvc,
# libDtWidget, libtt (ToolTalk) and friends live here and are referenced
# by bare soname.
/usr/dt/lib
# The 64-bit build's libraries.  Both linkers read this file and each
# skips objects of the other word size, so naming both directories is
# safe on an image that has only one of them.
/usr/dt/lib64
