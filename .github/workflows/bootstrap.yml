name: bootstrap

# The bootstrapped image, in its own workflow because it is expensive and
# must not be cancelled.
#
# ci.yml cancels superseded runs -- correct for jobs measured in seconds,
# and fatal here: every push during a toolchain build killed it, and a
# workflow-level cancel takes the whole run with it, so a job-level
# concurrency group cannot opt out.  Hence a separate workflow with
# cancel-in-progress off: a push while this is running queues behind it
# instead of throwing away an hour of gcc.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image-bootstrapped:
    name: bootstrapped image (stage 1 + stage 2 toolchain)
    runs-on: ubuntu-latest
    # gcc is --disable-bootstrap, so stage 1 is a single pass rather than
    # three; even so this is the long pole.  Cap under the 6h job limit.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # texinfo/bison/flex are binutils+gcc build requirements; gcc's own
      # contrib/download_prerequisites fetches gmp/mpfr/mpc/isl, so those
      # need no -dev packages here.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib python3 \
            texinfo bison flex gawk curl wget xz-utils \
            e2fsprogs dosfstools mtools fakeroot \
            grub-common grub-pc-bin util-linux zstd

      # build.sh installs into STAGE1_PREFIX only if its parent is writable;
      # /opt is root-owned on the runner.
      - name: Prepare /opt/substrate
        run: |
          sudo mkdir -p /opt/substrate
          sudo chown "$(id -u):$(id -g)" /opt/substrate

      # Keyed on the toolchain's own sources -- the patch series, the build
      # scripts and the pinned versions in fetch.sh.  Unchanged, this turns
      # the longest step in the workflow into a restore.
      - name: Cache the stage-1 cross toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: /opt/substrate
          key: substrate-stage1-${{ runner.os }}-${{ hashFiles('contrib/binutils/**', 'contrib/gcc/**', 'contrib/build-toolchain.sh') }}

      - name: Disk space before
        run: df -h /

      # Must precede stage 1: it is the sysroot libgcc is compiled against.
      - name: Build the in-tree userland (dist/)
        run: ./build-rootfs.sh --dist --no-boot

      - name: Build stage-1 cross toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        env:
          STAGE1_PREFIX: /opt/substrate
        run: contrib/build-toolchain.sh --stage=1

      - name: Show the stage-1 compiler
        run: |
          export PATH="/opt/substrate/bin:$PATH"
          i386-unknown-substrate-gcc --version | head -1
          i386-unknown-substrate-ld --version | head -1

      # Produces dist-overlay/dist-toolchain: binutils and gcc as substrate
      # ELFs, --prefix=/usr, for the image to carry.
      - name: Build stage-2 (substrate-native) toolchain
        env:
          STAGE1_PREFIX: /opt/substrate
        run: contrib/build-toolchain.sh --stage=2

      # TODO: the contrib ports go here, between stage 1 and the image.
      # They are not wired up yet: there are 139 of them and no build-order
      # manifest exists.  The order cannot be derived reliably from the
      # scripts either -- the `for d in ...` lists in build.sh are sysroot
      # merge lists ("use whatever is staged"), not dependency declarations,
      # and treating them as edges produces cycles among the X11 libraries.
      # Ports like pango and psymp3 resolve their dependencies through
      # pkg-config and the sysroot instead, so they look dependency-free.
      # Wiring them needs an authored manifest plus several CI rounds to
      # shake out; doing it here would mean a job that cannot pass.

      - name: Overlay the toolchain and bake the image
        run: ./build-rootfs.sh --toolchain --image --no-boot

      - name: Disk space after
        run: df -h /

      - name: Verify image
        run: |
          set -euo pipefail
          bytes=$(stat -c%s rootfs.img)
          echo "rootfs.img: $bytes bytes ($((bytes / 1024 / 1024)) MiB)"
          test "$bytes" -eq $((4096 * 1024 * 1024))
          ROOT_OFF=$((104448 * 512))
          e2fsck -fn "rootfs.img?offset=$ROOT_OFF"
          echo "--- the image carries its own compiler? ---"
          debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat /usr/bin/gcc" 2>/dev/null \
            | grep -E "Size:|Mode:"
          debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat /usr/bin/as" 2>/dev/null \
            | grep -E "Size:|Mode:"

      - name: Compress the image
        run: |
          zstd -T0 -3 --rm -f rootfs.img
          ls -lh rootfs.img.zst

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rootfs-image-bootstrapped
          path: rootfs.img.zst
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
