name: bootstrap

# The whole shebang: substrate's own toolchain, the contrib ports, and an
# image built with them.  Separate from ci.yml because it is expensive and
# must not be cancelled -- ci.yml cancels superseded runs, which is right
# for jobs measured in seconds and fatal here: a push during a toolchain
# build killed it three times, and a workflow-level cancel takes the whole
# run with it, so a job-level concurrency group cannot opt out.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    name: toolchain + contrib + image
    runs-on: ubuntu-latest
    # gcc is --disable-bootstrap so stage 1 is a single pass, but this still
    # builds two toolchains and 42 ports.  Cap under the 6h job limit.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # texinfo/bison/flex build binutils+gcc; gcc's own
      # contrib/download_prerequisites fetches gmp/mpfr/mpc/isl, so those
      # need no -dev packages.  The rest are what build-rootfs.sh's image
      # bake uses -- it works on a plain file with offsets, so no loop
      # device and no root.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib python3 \
            texinfo bison flex gawk curl wget xz-utils \
            e2fsprogs dosfstools mtools fakeroot \
            grub-common grub-pc-bin util-linux zstd

      # build.sh installs the stage-1 toolchain here and says so: make it
      # yours once, and then nothing in the build needs root.
      - name: Prepare /opt/substrate
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /opt/substrate

      # Both halves of the toolchain, keyed on its own sources -- the patch
      # series, the build scripts, the pinned versions in fetch.sh.  The
      # stage-2 staging tree has to ride along: build-rootfs.sh --toolchain
      # overlays dist-overlay/dist-toolchain, so restoring /opt/substrate
      # alone and skipping the toolchain would leave nothing to overlay.
      - name: Cache the toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: |
            /opt/substrate
            dist-overlay/dist-toolchain
          key: substrate-toolchain-${{ runner.os }}-${{ hashFiles('contrib/binutils/**', 'contrib/gcc/**', 'contrib/build-toolchain.sh') }}

      - name: Disk space before
        run: df -h /

      # The whole thing, in the order build.sh defines: stage 1 + stage 2
      # toolchain, kernel, libs, ld.so, base userland, then every port in
      # DEFAULT_CONTRIB -- a curated 42-port order, with the sysroot
      # re-synced after each one so the next port's configure probe finds
      # what the last one built -- then dist/, the toolchain overlay and
      # the image.
      #
      # Not every contrib/ port is in that list: the other ~95 (TDE, CDE,
      # GTK, xorg-server, ...) have no maintained order, and the ports
      # cannot supply one -- the `for d in ...` lists in build.sh are
      # sysroot merge lists rather than dependency declarations, so reading
      # them as edges puts the X11 libraries in a cycle.  DEFAULT_CONTRIB
      # is the set that is known to build in sequence; ONLY= overrides it.
      - name: Build everything
        env:
          SKIP_TOOLCHAIN: ${{ steps.tc.outputs.cache-hit == 'true' && '1' || '0' }}
        run: ./build.sh

      - name: Disk space after
        run: df -h /

      # The point of this job is not that a build ran, but that the image
      # carries a compiler it built itself.
      - name: Verify image
        run: |
          set -euo pipefail
          bytes=$(stat -c%s rootfs.img)
          echo "rootfs.img: $bytes bytes ($((bytes / 1024 / 1024)) MiB)"
          test "$bytes" -eq $((4096 * 1024 * 1024))
          ROOT_OFF=$((104448 * 512))
          e2fsck -fn "rootfs.img?offset=$ROOT_OFF"
          for f in /usr/bin/gcc /usr/bin/as /usr/bin/ld /usr/bin/zsh /usr/bin/xterm; do
            printf '%-16s ' "$f"
            debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat $f" 2>/dev/null \
              | grep -oE "Size: [0-9]+" | head -1 || echo "MISSING"
          done

      - name: Compress the image
        run: |
          zstd -T0 -3 --rm -f rootfs.img
          ls -lh rootfs.img.zst

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rootfs-image-bootstrapped
          path: rootfs.img.zst
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
