name: bootstrap

# The whole shebang: substrate's own toolchain, the contrib ports, and an
# image built with them.  Separate from ci.yml because it is expensive and
# must not be cancelled -- ci.yml cancels superseded runs, which is right
# for jobs measured in seconds and fatal here: a push during a toolchain
# build killed it three times, and a workflow-level cancel takes the whole
# run with it, so a job-level concurrency group cannot opt out.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    name: toolchain + contrib + image
    runs-on: ubuntu-latest
    # gcc is --disable-bootstrap so stage 1 is a single pass, but this still
    # builds two toolchains and 62 ports -- including Motif and CDE, which
    # are large.  Cap under the 6h job limit.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      # gettext supplies xgettext, which libXpm's sxpm runs on the BUILD host
      # to generate its message catalogue -- the port fails with "xgettext:
      # command not found" without it.  pkg-config is what e2tools and the
      # X11 ports use to find the staged libraries.
      # texinfo/bison/flex build binutils+gcc; gcc's own
      # contrib/download_prerequisites fetches gmp/mpfr/mpc/isl, so those
      # need no -dev packages.  The rest are what build-rootfs.sh's image
      # bake uses -- it works on a plain file with offsets, so no loop
      # device and no root.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib python3 \
            texinfo bison flex gawk curl wget xz-utils \
            gettext pkg-config \
            e2fsprogs dosfstools mtools fakeroot \
            grub-common grub-pc-bin util-linux zstd

      # build.sh installs the stage-1 toolchain here and says so: make it
      # yours once, and then nothing in the build needs root.
      - name: Prepare /opt/substrate
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /opt/substrate

      # Both halves of the toolchain, keyed on its own sources -- the patch
      # series, the build scripts, the pinned versions in fetch.sh.  BOTH
      # stage-2 staging trees have to ride along: build-rootfs.sh --toolchain
      # overlays dist-overlay/dist-toolchain (binutils) AND
      # /tmp/gcc-stage2-staging (gcc, which stages elsewhere because binutils
      # does `rm -rf` on dist-toolchain and would wipe it).  On a cache hit
      # build.sh skips stage 1g entirely, so whatever is not restored here is
      # simply not in the image -- caching only dist-toolchain produced a
      # green run whose image had as and ld but no gcc and no g++.
      - name: Cache the toolchain
        id: tc
        uses: actions/cache@v6
        with:
          path: |
            /opt/substrate
            dist-overlay/dist-toolchain
            /tmp/gcc-stage2-staging
          # Hash the tracked INPUTS only.  'contrib/gcc/**' also matches
          # contrib/gcc/build/, where fetch.sh unpacks the gcc source and
          # build.sh builds it -- several hundred thousand files by the time
          # the job ends.  The key is re-evaluated when the cache is saved in
          # the post step, and hashFiles gives up at 120 seconds:
          #
          #   The template is not valid ... hashFiles('contrib/binutils/**,
          #   contrib/gcc/**, contrib/build-toolchain.sh') couldn't finish
          #   within 120 seconds.
          #
          # which fails the job after a completely successful build.
          key: substrate-toolchain-${{ runner.os }}-${{ hashFiles('contrib/binutils/patches/**', 'contrib/binutils/series', 'contrib/binutils/*.sh', 'contrib/gcc/patches/**', 'contrib/gcc/series', 'contrib/gcc/*.sh', 'contrib/build-toolchain.sh') }}

      - name: Disk space before
        run: df -h /

      # The whole thing, in the order build.sh defines: stage 1 + stage 2
      # toolchain, kernel, libs, ld.so, base userland, then every port in
      # DEFAULT_CONTRIB -- a curated 62-port order, with the sysroot
      # re-synced after each one so the next port's configure probe finds
      # what the last one built -- then dist/, the toolchain overlay and
      # the image.  That now includes the Xfbdev framebuffer server and the
      # CDE desktop, so the image is checked to carry a working X, not just
      # the X client libraries.
      #
      # Not every contrib/ port is in that list: the rest (TDE, GTK, the
      # SDL/PsyMP3 stack, ...) have no maintained order, and the ports
      # cannot supply one -- the `for d in ...` lists in their build.sh are
      # sysroot merge lists rather than dependency declarations, so reading
      # them as edges puts the X11 libraries in a cycle.  DEFAULT_CONTRIB
      # is the set that is known to build in sequence; ONLY= overrides it.
      - name: Build everything
        env:
          SKIP_TOOLCHAIN: ${{ steps.tc.outputs.cache-hit == 'true' && '1' || '0' }}
        run: ./build.sh

      # A failed configure says only "C compiler cannot create executables"
      # and points at a config.log that lives inside the runner and is gone
      # the moment the job ends.  The actual compiler diagnostic -- the one
      # naming the missing library or object -- is in the conftest section of
      # that file, so print it rather than guessing across a 25-minute round
      # trip.  Everything before the conftest link is boilerplate.
      - name: configure logs (on failure)
        if: failure()
        run: |
          shopt -s nullglob
          # awk caps its own output: `sed ... | head` takes SIGPIPE when head
          # closes, and pipefail turns that into a step failure that swallows
          # every remaining log.  stage2 first -- it is the one that fails.
          for log in contrib/*/build-stage2/config.log \
                     contrib/*/build-stage1/config.log; do
            echo "::group::$log"
            awk '/checking whether the C compiler works/ {f=1}
                 f && n++ < 120' "$log"
            echo "::endgroup::"
          done

      - name: Disk space after
        run: df -h /

      # The point of this job is not that a build ran, but that the image
      # carries a compiler it built itself -- and now a working X too:
      # Xfbdev plus the keymap compiler and Motif/CDE it needs to be usable.
      - name: Verify image
        run: |
          set -euo pipefail
          bytes=$(stat -c%s rootfs.img)
          echo "rootfs.img: $bytes bytes ($((bytes / 1024 / 1024)) MiB)"
          test "$bytes" -eq $((4096 * 1024 * 1024))
          ROOT_OFF=$((104448 * 512))
          e2fsck -fn "rootfs.img?offset=$ROOT_OFF"
          # `|| echo MISSING` alone swallows the failure and the step passes,
          # which is how a run whose image had no gcc at all went green.
          # Collect the misses and fail on them.
          missing=""
          for f in /usr/bin/gcc /usr/bin/g++ /usr/bin/gdb \
                   /usr/bin/as /usr/bin/ld /usr/bin/zsh /usr/bin/xterm \
                   /usr/bin/Xfbdev /usr/bin/xkbcomp /usr/lib/libXm.so.4 \
                   /usr/dt/bin/dtwm /usr/dt/bin/dtsession /usr/dt/bin/dtterm; do
            printf '%-24s ' "$f"
            sz=$(debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat $f" 2>/dev/null \
                 | grep -oE "Size: [0-9]+" | head -1 || true)
            if [ -n "$sz" ]; then
              echo "$sz"
            else
              echo "MISSING"
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not in the image:$missing"
            exit 1
          fi

      - name: Compress the image
        run: |
          zstd -T0 -3 --rm -f rootfs.img
          ls -lh rootfs.img.zst

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: rootfs-image-bootstrapped
          path: rootfs.img.zst
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
