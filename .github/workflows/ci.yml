name: ci

# Basic CI for the Substrate tree.  Everything here builds or runs on the
# Linux runner itself -- the i386 kernel and userland cross-compile with the
# host gcc's -m32, and the testsuite under tests/ is host-native by design
# (NATIVE_BUILD / -DHOST_TEST).  Anything needing the substrate-native GNU
# toolchain (contrib/ ports, target torture tests) or a booted VM is out of
# scope: those want /opt/substrate and a qemu run, not a two-minute job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  kernel:
    name: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gcc-multilib supplies the 32-bit headers and libs that -m32 needs;
      # the kernel is -nostdinc but still pulls gcc's own include dir, which
      # Makefile.inc locates with `cc -m32 -print-file-name=include`.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3

      - name: Toolchain versions
        run: |
          cc --version | head -1
          ld --version | head -1
          echo "gcc 32-bit include: $(cc -m32 -print-file-name=include)"

      - name: Build kernel
        run: make -C sys -j"$(nproc)"

      - name: Kernel artifacts
        run: ls -l sys/kernel*.bin

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel
          path: sys/kernel*.bin
          if-no-files-found: warn
          retention-days: 7

  host-tests:
    name: host testsuite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3

      # tests/Makefile's `all` both builds and runs every host test, so a
      # failure here is either a build break or a red test -- the log says
      # which.  Note it stops at the first failing command in the recipe
      # rather than reporting every failure in one pass.
      - name: Build and run host tests
        run: make -C tests

  userland:
    name: userland libs and utils
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3

      # lib/Makefile's SUBDIRS is already in dependency order (m and sys ahead
      # of c, which links against both), and it covers the rest that bin needs
      # -- bin/passwd links -lpwdb.  Building lib/c alone leaves those out.
      # AGENTS.md directive 5's `make -C lib/c` is a subset of this.
      - name: Build libraries
        run: make -C lib -j"$(nproc)"

      - name: Build bin
        run: make -C bin -j"$(nproc)"

  image:
    name: full OS + 4GiB rootfs.img
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # build-rootfs.sh --image bakes a partitioned GRUB disk: p1 FAT32
      # (sub-boot) at LBA 2048, p2 ext2 (sub-root) at LBA 104448.  It builds
      # it as a plain file with offsets -- no loop device, no root -- so the
      # only requirement is the tools.  grub-mkimage lives in grub-common;
      # grub-pc-bin supplies the i386-pc modules and boot.img it embeds.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib python3 \
            e2fsprogs dosfstools mtools fakeroot \
            grub-common grub-pc-bin util-linux zstd

      - name: Disk space before
        run: df -h /

      # --no-boot is required: sys/boot does not compile, and without the
      # flag the script stops there and produces nothing.
      # --toolchain is deliberately omitted -- it only overlays the contrib
      # stage-2 gcc/binutils staging trees, which take hours to produce and
      # are not built here.
      - name: Build userland and bake the image
        run: ./build-rootfs.sh --dist --image --no-boot

      - name: Disk space after
        run: df -h /

      # Verify the image is actually an image, not a 4 GiB sparse file that
      # the bake quietly failed to populate.
      - name: Verify image
        run: |
          set -euo pipefail
          test -f rootfs.img
          bytes=$(stat -c%s rootfs.img)
          echo "rootfs.img: $bytes bytes ($((bytes / 1024 / 1024)) MiB)"
          test "$bytes" -eq $((4096 * 1024 * 1024))

          echo "--- partition table ---"
          sfdisk -l rootfs.img

          ROOT_OFF=$((104448 * 512))
          echo "--- fsck sub-root ---"
          e2fsck -fn "rootfs.img?offset=$ROOT_OFF"

          echo "--- kernel present in the image? ---"
          debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat /vmunix" 2>/dev/null \
            | grep -E "Size:|Mode:"

          echo "--- init present? ---"
          debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat /sbin/init" 2>/dev/null \
            | grep -E "Size:|Mode:"

      # 4 GiB raw is too big to keep, but the CI image uses only ~1.6% of its
      # blocks (see the fsck line above) and the rest is zeros, so it
      # compresses to something an artifact can hold.  --rm drops the raw
      # file; everything that reads it has already run.
      #
      # Level 3 (zstd's default) on purpose: measured on a 4 GiB image, -12
      # took 3.7x as long as -3 for 9.5% less output.  That is a poor trade
      # for a step whose only job is to make the image keepable, and it is
      # worse still here, where the input is mostly zeros and any level
      # collapses it.
      - name: Compress the image
        run: |
          zstd -T0 -3 --rm -f rootfs.img
          ls -lh rootfs.img.zst

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rootfs-image
          path: |
            rootfs.img.zst
            sys/kernel*.bin
          # Already compressed -- don't spend the time zipping it again.
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # The bootstrapped image: substrate's own GNU toolchain, built here.
  #
  # Ordering is not the one build-rootfs.sh's --help suggests, and the
  # difference matters.  gcc stage 1 is configured --with-sysroot=$TOP/dist
  # and builds libgcc against it, so dist/ has to be populated FIRST or
  # libgcc is skipped (build.sh treats it as best-effort and carries on) and
  # every later link that needs it fails.  So:
  #
  #   1. --dist                 in-tree userland, with the host gcc's -m32
  #   2. build-toolchain --stage=1   cross binutils+gcc, runs on the runner
  #   3. build-toolchain --stage=2   substrate-ELF binutils+gcc for the image
  #   4. --toolchain --image    overlay stage 2 onto dist/, then bake
  #
  # The contrib ports are NOT built here yet -- see the note on that step.
  # ---------------------------------------------------------------------
  image-bootstrapped:
    name: bootstrapped image (stage 1 + stage 2 toolchain)
    runs-on: ubuntu-latest
    # gcc is --disable-bootstrap, so stage 1 is a single pass rather than
    # three; even so this is the long pole.  Cap under the 6h job limit.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # texinfo/bison/flex are binutils+gcc build requirements; gcc's own
      # contrib/download_prerequisites fetches gmp/mpfr/mpc/isl, so those
      # need no -dev packages here.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib python3 \
            texinfo bison flex gawk curl wget xz-utils \
            e2fsprogs dosfstools mtools fakeroot \
            grub-common grub-pc-bin util-linux zstd

      # build.sh installs into STAGE1_PREFIX only if its parent is writable;
      # /opt is root-owned on the runner.
      - name: Prepare /opt/substrate
        run: |
          sudo mkdir -p /opt/substrate
          sudo chown "$(id -u):$(id -g)" /opt/substrate

      # Keyed on the toolchain's own sources -- the patch series, the build
      # scripts and the pinned versions in fetch.sh.  Unchanged, this turns
      # the longest step in the workflow into a restore.
      - name: Cache the stage-1 cross toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: /opt/substrate
          key: substrate-stage1-${{ runner.os }}-${{ hashFiles('contrib/binutils/**', 'contrib/gcc/**', 'contrib/build-toolchain.sh') }}

      - name: Disk space before
        run: df -h /

      # Must precede stage 1: it is the sysroot libgcc is compiled against.
      - name: Build the in-tree userland (dist/)
        run: ./build-rootfs.sh --dist --no-boot

      - name: Build stage-1 cross toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        env:
          STAGE1_PREFIX: /opt/substrate
        run: contrib/build-toolchain.sh --stage=1

      - name: Show the stage-1 compiler
        run: |
          export PATH="/opt/substrate/bin:$PATH"
          i386-unknown-substrate-gcc --version | head -1
          i386-unknown-substrate-ld --version | head -1

      # Produces dist-overlay/dist-toolchain: binutils and gcc as substrate
      # ELFs, --prefix=/usr, for the image to carry.
      - name: Build stage-2 (substrate-native) toolchain
        env:
          STAGE1_PREFIX: /opt/substrate
        run: contrib/build-toolchain.sh --stage=2

      # TODO: the contrib ports go here, between stage 1 and the image.
      # They are not wired up yet: there are 139 of them and no build-order
      # manifest exists.  The order cannot be derived reliably from the
      # scripts either -- the `for d in ...` lists in build.sh are sysroot
      # merge lists ("use whatever is staged"), not dependency declarations,
      # and treating them as edges produces cycles among the X11 libraries.
      # Ports like pango and psymp3 resolve their dependencies through
      # pkg-config and the sysroot instead, so they look dependency-free.
      # Wiring them needs an authored manifest plus several CI rounds to
      # shake out; doing it here would mean a job that cannot pass.

      - name: Overlay the toolchain and bake the image
        run: ./build-rootfs.sh --toolchain --image --no-boot

      - name: Disk space after
        run: df -h /

      - name: Verify image
        run: |
          set -euo pipefail
          bytes=$(stat -c%s rootfs.img)
          echo "rootfs.img: $bytes bytes ($((bytes / 1024 / 1024)) MiB)"
          test "$bytes" -eq $((4096 * 1024 * 1024))
          ROOT_OFF=$((104448 * 512))
          e2fsck -fn "rootfs.img?offset=$ROOT_OFF"
          echo "--- the image carries its own compiler? ---"
          debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat /usr/bin/gcc" 2>/dev/null \
            | grep -E "Size:|Mode:"
          debugfs "rootfs.img?offset=$ROOT_OFF" -R "stat /usr/bin/as" 2>/dev/null \
            | grep -E "Size:|Mode:"

      - name: Compress the image
        run: |
          zstd -T0 -3 --rm -f rootfs.img
          ls -lh rootfs.img.zst

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rootfs-image-bootstrapped
          path: rootfs.img.zst
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7

  utils:
    name: per-utility CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3

      # Each tests/ci/test-*.sh is self-contained and expects to be run from
      # the repo root.  Run them all rather than stopping at the first
      # failure, so one broken utility doesn't hide the state of the rest;
      # the job still fails if any did.  bench-* are benchmarks, not tests.
      - name: Run tests/ci scripts
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          failed=()
          for s in tests/ci/test-*.sh; do
            echo "::group::$s"
            if bash "$s"; then
              echo "PASS $s"
            else
              echo "FAIL $s"
              failed+=("$s")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
          echo "All tests/ci scripts passed."
